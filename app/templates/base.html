<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Watchlist{% endblock %}</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #e4e4e4;
      --accent: #1a1a1a;
      --error-text: #a12b1f;
      --error-bg: #fbf0ee;
      --success-text: #1e6b3a;
      --success-bg: #eef6f0;
      --notice-text: #7a5a00;
      --notice-bg: #fbf6e6;
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header { border-bottom: 1px solid var(--border); background: var(--surface); }
    header nav, main { max-width: 52rem; margin: 0 auto; padding: 0 1rem; }
    header nav { display: flex; gap: 1.5rem; }
    header a {
      padding: 0.9rem 0;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 2px solid transparent;
    }
    header a:hover { color: var(--text); }
    header a.current { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
    main { padding-top: 2rem; padding-bottom: 4rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 1.5rem; }
    h2 { font-size: 1rem; font-weight: 600; margin: 0; }
    section { margin-top: 2.5rem; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    form.add {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
      gap: 0.75rem;
      align-items: end;
      padding: 1rem;
    }
    label { display: grid; gap: 0.3rem; font-size: 0.8rem; color: var(--muted); }
    input, select, button { font: inherit; }
    input, select {
      width: 100%;
      padding: 0.45rem 0.6rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    input:focus, select:focus { outline: none; border-color: var(--text); }
    button {
      padding: 0.45rem 0.9rem;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    button.secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
    button.secondary:hover { border-color: var(--text); opacity: 1; }
    button.link {
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font-weight: 400;
    }
    button.link:hover { color: var(--error-text); opacity: 1; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 0.65rem 1rem; text-align: left; white-space: nowrap; }
    th { font-size: 0.75rem; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { border-bottom: 1px solid var(--border); }
    tbody tr:last-child td { border-bottom: 0; }
    td:first-child { font-weight: 600; }
    td.wrap { white-space: normal; }
    td.quiet { color: var(--muted); }
    td.end { text-align: right; }
    tr.fired td { color: var(--muted); }
    form.inline { display: inline; margin: 0; }
    .empty { padding: 2rem 1rem; margin: 0; text-align: center; color: var(--muted); }
    .message { padding: 0.6rem 0.9rem; margin: 0 0 1rem; border-radius: var(--radius); }
    .message.error { color: var(--error-text); background: var(--error-bg); }
    .message.success { color: var(--success-text); background: var(--success-bg); }
    .message.notice { color: var(--notice-text); background: var(--notice-bg); }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{{ url_for('watchlist.list_items') }}" {% if request.blueprint == 'watchlist' %}class="current"{% endif %}>Watchlist</a>
      <a href="{{ url_for('alerts.list_rules') }}" {% if request.blueprint == 'alerts' %}class="current"{% endif %}>Alerts</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="message {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
