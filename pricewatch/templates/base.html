<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PriceWatch{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #ddd; }
    form.inline { display: inline; }
    label { display: block; margin-top: 0.5rem; }
    .flash { padding: 0.5rem; margin: 0.5rem 0; border-radius: 4px; }
    .flash.error { background: #fde2e2; }
    .flash.success { background: #e2f5e2; }
  </style>
</head>
<body>
  <nav><strong>PriceWatch</strong> &middot; <a href="{{ url_for('watchlist.list_items') }}">Watchlist</a></nav>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
